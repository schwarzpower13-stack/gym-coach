<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coach">
<meta name="theme-color" content="#0c0d10">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="img/icons/icon-180.png">
<title>PPL Coach</title>
<style>
:root {
  color-scheme: dark;
  --bg: #0c0d10; --card: #16181d; --card2: #1d2027; --line: #2a2e37;
  --text: #f2f3f5; --mute: #9aa0ab; --dim: #6b717c;
  --acc: #c6ff3d; --acc-ink: #0c0d10; --warn: #ffb547; --bad: #ff5d5d; --good: #3ddc84; --blue: #5aa9ff;
  --r: 16px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font: 15px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "Noto Sans Georgian", sans-serif; padding: env(safe-area-inset-top) 0 calc(78px + env(safe-area-inset-bottom)); overflow-x: hidden; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--acc); }
.wrap { max-width: 640px; margin: 0 auto; padding: 12px 16px 24px; }
h1 { font-size: 28px; margin: 8px 0 2px; letter-spacing: -.02em; }
h2 { font-size: 19px; margin: 22px 0 10px; letter-spacing: -.01em; }
h3 { font-size: 16px; margin: 0; }
.sub { color: var(--mute); font-size: 13px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; margin: 10px 0; }
.row { display: flex; gap: 10px; align-items: center; }
.between { justify-content: space-between; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--card2); border-radius: 12px; padding: 10px 12px; }
.stat b { display: block; font-size: 22px; letter-spacing: -.02em; }
.stat span { color: var(--mute); font-size: 12px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--card2); border: 1px solid var(--line); font-size: 12px; color: var(--mute); }
.pill.acc { background: var(--acc); color: var(--acc-ink); border-color: var(--acc); font-weight: 600; }
.pill.warn { color: var(--warn); border-color: #5a4320; }
.btn { border: 0; border-radius: 12px; padding: 12px 16px; background: var(--card2); font-weight: 600; }
.btn.acc { background: var(--acc); color: var(--acc-ink); }
.btn.block { width: 100%; }
.btn.sm { padding: 7px 12px; font-size: 13px; border-radius: 10px; }
.seg { display: flex; background: var(--card2); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { flex: 1; border: 0; background: transparent; padding: 9px 6px; border-radius: 9px; color: var(--mute); font-weight: 600; font-size: 13px; }
.seg button.on { background: var(--acc); color: var(--acc-ink); }
.days { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 8px; scrollbar-width: none; }
.days::-webkit-scrollbar { display: none; }
.days button { flex: 0 0 auto; min-width: 62px; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 8px 6px; text-align: center; }
.days button small { display: block; color: var(--dim); font-size: 11px; }
.days button.on { border-color: var(--acc); box-shadow: inset 0 0 0 1px var(--acc); }
.days button.today small { color: var(--acc); }

/* exercise */
.ex { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); margin: 10px 0; overflow: hidden; }
.ex-h { display: flex; gap: 12px; align-items: center; padding: 12px 14px; width: 100%; border: 0; background: none; text-align: left; }
.ex-n { width: 30px; height: 30px; flex: 0 0 30px; border-radius: 9px; display: grid; place-items: center; background: var(--card2); font-weight: 700; font-size: 13px; color: var(--mute); }
.ex.done .ex-n { background: var(--good); color: #062; }
.ex-t { flex: 1; min-width: 0; }
.ex-t b { display: block; font-size: 15px; }
.ex-t span { color: var(--mute); font-size: 12.5px; }
.ex-sr { font-weight: 700; font-size: 14px; white-space: nowrap; }
.ex-b { padding: 0 14px 14px; display: none; }
.ex.open .ex-b { display: block; }
.vid { position: relative; aspect-ratio: 16/9; border-radius: 12px; overflow: hidden; background: #000; margin-bottom: 10px; }
.vid.vert { aspect-ratio: 9/16; max-height: 70vh; margin-left: auto; margin-right: auto; }
.vid img, .vid iframe { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border: 0; }
.vid .play { position: absolute; inset: 0; display: grid; place-items: center; background: linear-gradient(transparent 50%, rgba(0,0,0,.5)); border: 0; }
.vid .play i { width: 58px; height: 58px; border-radius: 50%; background: rgba(0,0,0,.6); display: grid; place-items: center; backdrop-filter: blur(6px); }
.vid .play i::after { content: ""; border-left: 18px solid #fff; border-top: 11px solid transparent; border-bottom: 11px solid transparent; margin-left: 5px; }
.cues { margin: 0 0 10px; padding-left: 18px; color: #d4d7dd; font-size: 13.5px; }
.note { font-size: 12.5px; color: var(--mute); margin: 6px 0; }
.spine { font-size: 12.5px; color: var(--warn); background: #2a2113; border-radius: 10px; padding: 7px 10px; margin: 6px 0 10px; }
.sug { font-size: 12.5px; color: var(--acc); margin: 4px 0 8px; }
table.sets { width: 100%; border-collapse: collapse; }
.sets th { font-size: 11px; color: var(--dim); font-weight: 500; text-align: center; padding: 2px; }
.sets td { padding: 3px; text-align: center; }
.sets td.prev { color: var(--dim); font-size: 12px; }
.sets input { width: 100%; max-width: 76px; text-align: center; background: var(--card2); border: 1px solid var(--line); border-radius: 9px; padding: 8px 4px; font-size: 16px; }
.sets .ck { width: 38px; height: 36px; border-radius: 9px; border: 1px solid var(--line); background: var(--card2); }
.sets tr.ok .ck { background: var(--good); border-color: var(--good); }
.sets tr.ok .ck::after { content: "✓"; color: #062; font-weight: 800; }
.sets tr.ok input { border-color: #2c5a3c; }

/* workout bar */
.wbar { position: sticky; top: env(safe-area-inset-top); z-index: 5; background: rgba(12,13,16,.92); backdrop-filter: blur(10px); margin: 0 -16px; padding: 8px 16px; border-bottom: 1px solid var(--line); display: none; }
.wbar.on { display: flex; }
.rest { position: fixed; left: 16px; right: 16px; bottom: calc(86px + env(safe-area-inset-bottom)); max-width: 608px; margin: 0 auto; background: var(--acc); color: var(--acc-ink); border-radius: 16px; padding: 12px 16px; display: none; align-items: center; gap: 12px; z-index: 20; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
.rest.on { display: flex; }
.rest b { font-size: 26px; font-variant-numeric: tabular-nums; }
.rest button { border: 0; background: rgba(0,0,0,.12); border-radius: 10px; padding: 8px 10px; font-weight: 700; color: var(--acc-ink); }

/* meals */
.meal { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; margin: 12px 0; }
.meal img { width: 100%; aspect-ratio: 16/10; object-fit: cover; display: block; }
.meal .mb { padding: 12px 14px; }
.meal .slot { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--acc); font-weight: 700; }
.macros { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
.macros span { font-size: 12px; padding: 3px 8px; border-radius: 8px; background: var(--card2); color: var(--mute); }
.macros span b { color: var(--text); }
.meal details { margin-top: 6px; }
.meal summary { color: var(--mute); font-size: 13px; cursor: pointer; }
.meal ul, .meal ol { padding-left: 18px; margin: 8px 0; font-size: 13.5px; color: #d4d7dd; }
.meal .eat { margin-top: 10px; }
.meal.eaten { opacity: .55; }
.bar { height: 8px; background: var(--card2); border-radius: 99px; overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; background: var(--acc); border-radius: 99px; }
.water { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.water button { width: 34px; height: 42px; border-radius: 8px; border: 1px solid var(--line); background: var(--card2); }
.water button.f { background: var(--blue); border-color: var(--blue); }

/* forms */
label.f { display: block; font-size: 12px; color: var(--mute); }
label.f input, label.f select { display: block; width: 100%; margin-top: 4px; background: var(--card2); border: 1px solid var(--line); border-radius: 10px; padding: 10px; font-size: 16px; }
.why { display: grid; grid-template-columns: 30px 1fr; gap: 8px; padding: 10px 0; border-top: 1px solid var(--line); }
.why:first-child { border-top: 0; }
.why .e { font-size: 20px; }
.why p { margin: 2px 0 0; color: var(--mute); font-size: 13px; }
.steps { counter-reset: s; list-style: none; padding: 0; margin: 0; }
.steps li { counter-increment: s; position: relative; padding: 8px 0 8px 36px; border-top: 1px solid var(--line); font-size: 14px; }
.steps li::before { content: counter(s); position: absolute; left: 0; top: 8px; width: 24px; height: 24px; border-radius: 7px; background: var(--card2); display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--acc); }
code { background: var(--card2); padding: 1px 6px; border-radius: 6px; font-size: 12.5px; word-break: break-all; }
.chart { width: 100%; height: 120px; display: block; }
.ring { position: relative; width: 104px; height: 104px; flex: 0 0 104px; }
.ring svg { transform: rotate(-90deg); }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 28px; }
.muscles div { display: grid; grid-template-columns: 110px 1fr 34px; gap: 8px; align-items: center; font-size: 13px; margin: 5px 0; }
.muscles .bar { margin: 0; }
.toast { position: fixed; top: calc(12px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%) translateY(-120%); background: var(--card2); border: 1px solid var(--line); padding: 10px 16px; border-radius: 12px; z-index: 50; transition: transform .3s; font-size: 14px; max-width: 90vw; }
.toast.on { transform: translateX(-50%) translateY(0); }
.hide { display: none !important; }

/* discipline */
:root { --badbg: #2a1517; --goodbg: #13261b; }
.st-done, .st-bonus { background: var(--good) !important; color: #062 !important; }
.st-bonus { background: var(--blue) !important; color: #031 !important; }
.st-part { background: var(--warn) !important; color: #3a2400 !important; }
.st-miss { background: var(--bad) !important; color: #3a0000 !important; }
.st-rest, .st-none, .st-fut { background: var(--card2) !important; color: var(--dim) !important; }
.st-fut { opacity: .35; }
.st-pend { background: transparent !important; box-shadow: inset 0 0 0 1.5px var(--dim); color: var(--mute) !important; }
.card.miss { border-color: var(--bad); background: var(--badbg); }
.card.ok { border-color: #2c5a3c; }
.pill.bad { color: var(--bad); border-color: var(--bad); background: var(--badbg); }
.pill.good { color: var(--good); border-color: #2c5a3c; background: var(--goodbg); }
.btn.ghost-bad { background: transparent; color: var(--bad); box-shadow: inset 0 0 0 1px #5a2a2a; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.chip { border: 1px solid var(--line); background: var(--card2); border-radius: 999px; padding: 7px 12px; font-size: 13px; }
.chip.on { background: var(--acc); color: var(--acc-ink); border-color: var(--acc); font-weight: 600; }
.misspick { margin-top: 10px; padding: 10px; border-radius: 12px; background: var(--badbg); }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin: 14px 0 4px; }
.wd { text-align: center; }
.wd small { display: block; font-size: 11px; color: var(--dim); }
.wd.now small { color: var(--acc); font-weight: 700; }
.wd b { display: grid; place-items: center; height: 34px; border-radius: 10px; margin: 3px 0; font-size: 14px; }
.wd span { display: flex; justify-content: center; gap: 2px; min-height: 5px; }
.wd span i { width: 5px; height: 5px; border-radius: 50%; }
.heat { display: grid; grid-template-columns: 22px repeat(28, 1fr); gap: 2px; align-items: center; }
.heat i { aspect-ratio: 1; border-radius: 2px; display: block; }
.heat .hl { font-size: 13px; }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin: 0 2px 0 6px; }
.adh b { font-size: 24px; }
.adh.good b { color: var(--good); } .adh.warn b { color: var(--warn); } .adh.bad b { color: var(--bad); }
.adh.bad { box-shadow: inset 0 0 0 1px #5a2a2a; background: var(--badbg); }
.note-bad, .note-warn, .note-good { border-left: 3px solid; padding: 6px 10px; margin-top: 10px; border-radius: 4px 10px 10px 4px; background: var(--card2); }
.note-bad { border-color: var(--bad); } .note-warn { border-color: var(--warn); } .note-good { border-color: var(--good); }
.note-bad p, .note-warn p, .note-good p { margin: 3px 0 0; color: var(--mute); font-size: 13px; }
.recrow { display: flex; gap: 8px; margin-top: 8px; }
.recrow.rec-miss .btn:first-child { background: var(--badbg); color: var(--bad); }
.meal.missed { border-color: var(--bad); }
.meal.missed img { filter: grayscale(.7) brightness(.7); }

/* food timeline */
.tl { display: grid; grid-template-columns: 62px 1fr 44px; gap: 10px; align-items: start; padding: 10px 0; border-top: 1px solid var(--line); }
.tl-t b { display: block; font-size: 16px; font-variant-numeric: tabular-nums; }
.tl-t small { color: var(--dim); font-size: 11px; }
.tl-n { font-size: 14px; }
.tl.ok .tl-t b { color: var(--good); }
.tl.bad .tl-t b { color: var(--bad); }
.tl.bad { background: linear-gradient(90deg, var(--badbg), transparent); }
.cam { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--card2); font-size: 20px; }
.thumbs { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.thumbs figure { margin: 0; width: 92px; }
.thumbs img { width: 92px; height: 92px; object-fit: cover; border-radius: 10px; background: var(--card2); display: block; }
.thumbs figcaption { display: flex; gap: 2px; margin-top: 3px; }
.thumbs input { width: 64px; background: var(--card2); border: 1px solid var(--line); border-radius: 6px; font-size: 12px; padding: 2px; }
.thumbs button { border: 0; background: none; color: var(--dim); }
.card.loading { opacity: .6; }
/* rituals */
.ritrow { display: grid; grid-template-columns: 28px 1fr auto 14px; gap: 10px; align-items: center; width: 100%; background: none; border: 0; border-top: 1px solid var(--line); padding: 10px 0; text-align: left; }
.ritrow i { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; font-style: normal; font-weight: 800; font-size: 13px; }
.ritrow small { color: var(--dim); font-size: 11px; } .ritrow em { color: var(--dim); font-style: normal; }
.st-row-miss span { color: var(--bad); }
.rit { display: grid; grid-template-columns: 38px 1fr; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.rit p { margin: 2px 0 6px; color: var(--mute); font-size: 12.5px; }
.rit .ck { width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line); background: var(--card2); }
.rit.on .ck { background: var(--good); border-color: var(--good); } .rit.on .ck::after { content: "✓"; color: #062; font-weight: 800; }
.jin { display: block; width: 100%; margin-top: 6px; background: var(--card2); border: 1px solid var(--line); border-radius: 10px; padding: 10px; font-size: 16px; color: var(--text); }
/* session overlay */
#sess { position: fixed; inset: 0; z-index: 60; background: radial-gradient(circle at 50% 40%, #1a2230, var(--bg) 70%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: calc(20px + env(safe-area-inset-top)) 24px calc(30px + env(safe-area-inset-bottom)); text-align: center; }
#sess[hidden] { display: none; }
#sess .x { position: absolute; top: calc(14px + env(safe-area-inset-top)); right: 16px; width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--card2); font-size: 18px; }
.sess-top { color: var(--mute); font-size: 14px; letter-spacing: .04em; }
.orb { width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #d8ff7a, #6fbf2a 45%, #1d3a12 80%); box-shadow: 0 0 80px rgba(198,255,61,.35); transition: transform .12s linear; transform: scale(.6); }
.orb.squeeze { background: radial-gradient(circle at 50% 45%, #ffffff, #d9c2ff 35%, #6b3fd1 70%, #1c1036 95%); box-shadow: 0 0 110px rgba(190,150,255,.55); }
.sess-steps { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; max-width: 340px; min-height: 0; }
.sess-steps span { font-size: 12px; padding: 4px 9px; border-radius: 999px; background: var(--card2); color: var(--dim); }
.sess-steps span.on { background: var(--acc); color: var(--acc-ink); font-weight: 700; }
.orb.calm { background: radial-gradient(circle at 35% 30%, #a9d4ff, #3d6fb0 50%, #101c30 85%); box-shadow: 0 0 80px rgba(90,169,255,.3); }
.sess-big { font-size: 56px; font-weight: 800; font-variant-numeric: tabular-nums; }
.sess-sub { color: var(--mute); font-size: 16px; max-width: 320px; line-height: 1.5; }
.ring-big { position: relative; width: 240px; height: 240px; } .ring-big b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 48px; font-variant-numeric: tabular-nums; }
/* flashcards */
.flash { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 26px 18px; margin: 12px 0; text-align: center; min-height: 230px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; cursor: pointer; }
.fw { font-size: 32px; font-weight: 800; letter-spacing: -.01em; text-wrap: balance; }
.fa { font-size: 22px; color: var(--acc); font-weight: 700; margin-top: 8px; text-wrap: balance; }
.grade { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.grade .btn { padding: 14px 6px; font-size: 14px; }
.g0 { background: var(--badbg); color: var(--bad); } .g1 { background: #2a2413; color: var(--warn); } .g2 { background: var(--goodbg); color: var(--good); }

/* nav */
nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(16,17,21,.94); backdrop-filter: blur(14px); border-top: 1px solid var(--line); display: flex; padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); z-index: 10; }
nav button { flex: 1; border: 0; background: none; color: var(--dim); font-size: 10.5px; padding: 4px 0; display: flex; flex-direction: column; align-items: center; gap: 2px; }
nav button svg { width: 24px; height: 24px; }
nav button.on { color: var(--acc); }
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<main class="wrap" id="app"></main>
<input type="file" id="photoIn" accept="image/*" hidden onchange="onPhoto(this)">
<div class="rest" id="rest">
  <div style="flex:1"><div style="font-size:12px;font-weight:600">დასვენება</div><b id="restT">0:00</b></div>
  <button id="restMinus">−15</button><button id="restPlus">+15</button><button id="restSkip">✕</button>
</div>
<nav id="nav">
  <button data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>დღეს</button>
  <button data-tab="train"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>ვარჯიში</button>
  <button data-tab="food"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 3v8a3 3 0 0 0 6 0V3M7 3v18M17 21V3c-2 0-3.5 2.5-3.5 6s1.5 5 3.5 5"/></svg>კვება</button>
  <button data-tab="spirit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3c2 3 5 5 5 9a5 5 0 0 1-10 0c0-4 3-6 5-9zM12 21v-4"/></svg>სული</button>
  <button data-tab="learn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 5h7a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H4zM20 5h-4a2 2 0 0 0-2 2"/></svg>სწავლა</button>
  <button data-tab="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>პროგრესი</button>
</nav>
<script src="data.js"></script>
<script src="discipline.js"></script>
<script src="words.js"></script>
<script src="foodlog.js"></script>
<script src="spirit.js"></script>
<script src="learn.js"></script>
<script src="migrate.js"></script>
<script src="app.js"></script>
</body>
</html>

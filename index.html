<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coach">
<meta name="theme-color" content="#0f1519">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="img/icons/icon-180.png">
<title>PPL Coach</title>
<style>
:root {
  color-scheme: dark;
  --bg: #0f1519; --card: #151d22; --card2: #1b252b; --line: #243038;
  --text: #e7eef0; --mute: #a3b3ba; --dim: #6f8189;
  --acc: #86d5c0; --acc-ink: #0b1c17; --warn: #e6c27f; --bad: #e39a8f; --good: #9fd49a; --blue: #93b9e6; --lav: #b8a8f0;
  --glow: rgba(134,213,192,.18);
  --r: 18px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { background: radial-gradient(900px 500px at 10% -10%, rgba(134,213,192,.10), transparent 60%), radial-gradient(700px 420px at 100% 0%, rgba(184,168,240,.09), transparent 60%), var(--bg); background-attachment: fixed; }
#app > * { animation: rise .35s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { #app > * { animation: none; } .orb { transition: none; } }
h1, h2, h3 { letter-spacing: -.015em; text-wrap: balance; }
h1 { font-weight: 800; }
body { font: 15px/1.5 "Manrope", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "Noto Sans Georgian", sans-serif; -webkit-font-smoothing: antialiased; padding: env(safe-area-inset-top) 0 calc(78px + env(safe-area-inset-bottom)); overflow-x: hidden; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--acc); }
.wrap { max-width: 640px; margin: 0 auto; padding: 12px 16px 24px; }
h1 { font-size: 28px; margin: 8px 0 2px; letter-spacing: -.02em; }
h2 { font-size: 19px; margin: 22px 0 10px; letter-spacing: -.01em; }
h3 { font-size: 16px; margin: 0; }
.sub { color: var(--mute); font-size: 13px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; margin: 12px 0; box-shadow: 0 1px 0 rgba(255,255,255,.02) inset; }
.row { display: flex; gap: 10px; align-items: center; }
.between { justify-content: space-between; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--card2); border-radius: 12px; padding: 10px 12px; }
.stat b { display: block; font-size: 22px; letter-spacing: -.02em; }
.stat span { color: var(--mute); font-size: 12px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--card2); border: 1px solid var(--line); font-size: 12px; color: var(--mute); }
.pill.acc { background: var(--acc); color: var(--acc-ink); border-color: var(--acc); font-weight: 600; }
.pill.warn { color: var(--warn); border-color: #5a4320; }
.btn { border: 0; border-radius: 12px; padding: 12px 16px; background: var(--card2); font-weight: 600; }
.btn.acc { background: var(--acc); color: var(--acc-ink); }
.btn.block { width: 100%; }
.btn.sm { padding: 7px 12px; font-size: 13px; border-radius: 10px; }
.seg { display: flex; background: var(--card2); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { flex: 1; border: 0; background: transparent; padding: 9px 6px; border-radius: 9px; color: var(--mute); font-weight: 600; font-size: 13px; }
.seg button.on { background: var(--acc); color: var(--acc-ink); }
.days { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 8px; scrollbar-width: none; }
.days::-webkit-scrollbar { display: none; }
.days button { flex: 0 0 auto; min-width: 62px; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 8px 6px; text-align: center; }
.days button small { display: block; color: var(--dim); font-size: 11px; }
.days button.on { border-color: var(--acc); box-shadow: inset 0 0 0 1px var(--acc); }
.days button.today small { color: var(--acc); }

/* exercise */
.ex { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); margin: 10px 0; overflow: hidden; }
.ex-h { display: flex; gap: 12px; align-items: center; padding: 12px 14px; width: 100%; border: 0; background: none; text-align: left; }
.ex-n { width: 30px; height: 30px; flex: 0 0 30px; border-radius: 9px; display: grid; place-items: center; background: var(--card2); font-weight: 700; font-size: 13px; color: var(--mute); }
.ex.done .ex-n { background: var(--good); color: #10240f; }
.ex-t { flex: 1; min-width: 0; }
.ex-t b { display: block; font-size: 15px; }
.ex-t span { color: var(--mute); font-size: 12.5px; }
.ex-sr { font-weight: 700; font-size: 14px; white-space: nowrap; }
.ex-b { padding: 0 14px 14px; display: none; }
.ex.open .ex-b { display: block; }
.vid { position: relative; aspect-ratio: 16/9; border-radius: 12px; overflow: hidden; background: #000; margin-bottom: 10px; }
.vid.vert { aspect-ratio: 9/16; max-height: 70vh; margin-left: auto; margin-right: auto; }
.vid img, .vid iframe { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border: 0; }
.vid .play { position: absolute; inset: 0; display: grid; place-items: center; background: linear-gradient(transparent 50%, rgba(0,0,0,.5)); border: 0; }
.vid .play i { width: 58px; height: 58px; border-radius: 50%; background: rgba(0,0,0,.6); display: grid; place-items: center; backdrop-filter: blur(6px); }
.vid .play i::after { content: ""; border-left: 18px solid #fff; border-top: 11px solid transparent; border-bottom: 11px solid transparent; margin-left: 5px; }
.cues { margin: 0 0 10px; padding-left: 18px; color: #d4d7dd; font-size: 13.5px; }
.note { font-size: 12.5px; color: var(--mute); margin: 6px 0; }
.spine { font-size: 12.5px; color: var(--warn); background: #2a2113; border-radius: 10px; padding: 7px 10px; margin: 6px 0 10px; }
.sug { font-size: 12.5px; color: var(--acc); margin: 4px 0 8px; }
table.sets { width: 100%; border-collapse: collapse; }
.sets th { font-size: 11px; color: var(--dim); font-weight: 500; text-align: center; padding: 2px; }
.sets td { padding: 3px; text-align: center; }
.sets td.prev { color: var(--dim); font-size: 12px; }
.sets input { width: 100%; max-width: 76px; text-align: center; background: var(--card2); border: 1px solid var(--line); border-radius: 9px; padding: 8px 4px; font-size: 16px; }
.sets .ck { width: 38px; height: 36px; border-radius: 9px; border: 1px solid var(--line); background: var(--card2); }
.sets tr.ok .ck { background: var(--good); border-color: var(--good); }
.sets tr.ok .ck::after { content: "✓"; color: #10240f; font-weight: 800; }
.sets tr.ok input { border-color: rgba(159,212,154,.35); }

/* workout bar */
.wbar { position: sticky; top: env(safe-area-inset-top); z-index: 5; background: rgba(12,13,16,.92); backdrop-filter: blur(10px); margin: 0 -16px; padding: 8px 16px; border-bottom: 1px solid var(--line); display: none; }
.wbar.on { display: flex; }
.rest { position: fixed; left: 16px; right: 16px; bottom: calc(86px + env(safe-area-inset-bottom)); max-width: 608px; margin: 0 auto; background: var(--acc); color: var(--acc-ink); border-radius: 16px; padding: 12px 16px; display: none; align-items: center; gap: 12px; z-index: 20; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
.rest.on { display: flex; }
.rest b { font-size: 26px; font-variant-numeric: tabular-nums; }
.rest button { border: 0; background: rgba(0,0,0,.12); border-radius: 10px; padding: 8px 10px; font-weight: 700; color: var(--acc-ink); }

/* meals */
.meal { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; margin: 12px 0; }
.meal img { width: 100%; aspect-ratio: 16/10; object-fit: cover; display: block; }
.meal .mb { padding: 12px 14px; }
.meal .slot { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--acc); font-weight: 700; }
.macros { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
.macros span { font-size: 12px; padding: 3px 8px; border-radius: 8px; background: var(--card2); color: var(--mute); }
.macros span b { color: var(--text); }
.meal details { margin-top: 6px; }
.meal summary { color: var(--mute); font-size: 13px; cursor: pointer; }
.meal ul, .meal ol { padding-left: 18px; margin: 8px 0; font-size: 13.5px; color: #d4d7dd; }
.meal .eat { margin-top: 10px; }
.meal.eaten { opacity: .55; }
.bar { height: 8px; background: var(--card2); border-radius: 99px; overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; background: var(--acc); border-radius: 99px; }
.water { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.water button { width: 34px; height: 42px; border-radius: 8px; border: 1px solid var(--line); background: var(--card2); }
.water button.f { background: var(--blue); border-color: var(--blue); }

/* forms */
label.f { display: block; font-size: 12px; color: var(--mute); }
label.f input, label.f select { display: block; width: 100%; margin-top: 4px; background: var(--card2); border: 1px solid var(--line); border-radius: 10px; padding: 10px; font-size: 16px; }
.why { display: grid; grid-template-columns: 30px 1fr; gap: 8px; padding: 10px 0; border-top: 1px solid var(--line); }
.why:first-child { border-top: 0; }
.why .e { font-size: 20px; }
.why p { margin: 2px 0 0; color: var(--mute); font-size: 13px; }
.steps { counter-reset: s; list-style: none; padding: 0; margin: 0; }
.steps li { counter-increment: s; position: relative; padding: 8px 0 8px 36px; border-top: 1px solid var(--line); font-size: 14px; }
.steps li::before { content: counter(s); position: absolute; left: 0; top: 8px; width: 24px; height: 24px; border-radius: 7px; background: var(--card2); display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--acc); }
code { background: var(--card2); padding: 1px 6px; border-radius: 6px; font-size: 12.5px; word-break: break-all; }
.chart { width: 100%; height: 120px; display: block; }
.ring { position: relative; width: 104px; height: 104px; flex: 0 0 104px; }
.ring svg { transform: rotate(-90deg); }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 28px; }
.muscles div { display: grid; grid-template-columns: 110px 1fr 34px; gap: 8px; align-items: center; font-size: 13px; margin: 5px 0; }
.muscles .bar { margin: 0; }
.toast { position: fixed; top: calc(12px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%) translateY(-120%); background: var(--card2); border: 1px solid var(--line); padding: 10px 16px; border-radius: 12px; z-index: 50; transition: transform .3s; font-size: 14px; max-width: 90vw; }
.toast.on { transform: translateX(-50%) translateY(0); }
.hide { display: none !important; }

/* discipline */
:root { --badbg: #261c1e; --goodbg: #15241b; }
.st-done, .st-bonus { background: var(--good) !important; color: #10240f !important; }
.st-bonus { background: var(--blue) !important; color: #0d1d30 !important; }
.st-part { background: var(--warn) !important; color: #2e2208 !important; }
.st-miss { background: var(--bad) !important; color: #2c1512 !important; }
.st-rest, .st-none, .st-fut { background: var(--card2) !important; color: var(--dim) !important; }
.st-fut { opacity: .35; }
.st-pend { background: transparent !important; box-shadow: inset 0 0 0 1.5px var(--dim); color: var(--mute) !important; }
.card.miss { border-color: var(--bad); background: var(--badbg); }
.card.ok { border-color: rgba(159,212,154,.32); }
.pill.bad { color: var(--bad); border-color: var(--bad); background: var(--badbg); }
.pill.good { color: var(--good); border-color: rgba(159,212,154,.32); background: var(--goodbg); }
.btn.ghost-bad { background: transparent; color: var(--bad); box-shadow: inset 0 0 0 1px rgba(227,154,143,.32); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.chip { border: 1px solid var(--line); background: var(--card2); border-radius: 999px; padding: 7px 12px; font-size: 13px; }
.chip.on { background: var(--acc); color: var(--acc-ink); border-color: var(--acc); font-weight: 600; }
.misspick { margin-top: 10px; padding: 10px; border-radius: 12px; background: var(--badbg); }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin: 14px 0 4px; }
.wd { text-align: center; }
.wd small { display: block; font-size: 11px; color: var(--dim); }
.wd.now small { color: var(--acc); font-weight: 700; }
.wd b { display: grid; place-items: center; height: 34px; border-radius: 10px; margin: 3px 0; font-size: 14px; }
.wd span { display: flex; justify-content: center; gap: 2px; min-height: 5px; }
.wd span i { width: 5px; height: 5px; border-radius: 50%; }
.heat { display: grid; grid-template-columns: 22px repeat(28, 1fr); gap: 2px; align-items: center; }
.heat i { aspect-ratio: 1; border-radius: 2px; display: block; }
.heat .hl { font-size: 13px; }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin: 0 2px 0 6px; }
.adh b { font-size: 24px; }
.adh.good b { color: var(--good); } .adh.warn b { color: var(--warn); } .adh.bad b { color: var(--bad); }
.adh.bad { box-shadow: inset 0 0 0 1px rgba(227,154,143,.32); background: var(--badbg); }
.note-bad, .note-warn, .note-good { border-left: 3px solid; padding: 6px 10px; margin-top: 10px; border-radius: 4px 10px 10px 4px; background: var(--card2); }
.note-bad { border-color: var(--bad); } .note-warn { border-color: var(--warn); } .note-good { border-color: var(--good); }
.note-bad p, .note-warn p, .note-good p { margin: 3px 0 0; color: var(--mute); font-size: 13px; }
.recrow { display: flex; gap: 8px; margin-top: 8px; }
.recrow.rec-miss .btn:first-child { background: var(--badbg); color: var(--bad); }
.meal.missed { border-color: var(--bad); }
.meal.missed img { filter: grayscale(.7) brightness(.7); }

/* food timeline */
.tl { display: grid; grid-template-columns: 62px 1fr 44px; gap: 10px; align-items: start; padding: 10px 0; border-top: 1px solid var(--line); }
.tl-t b { display: block; font-size: 16px; font-variant-numeric: tabular-nums; }
.tl-t small { color: var(--dim); font-size: 11px; }
.tl-n { font-size: 14px; }
.tl.ok .tl-t b { color: var(--good); }
.tl.bad .tl-t b { color: var(--bad); }
.tl.bad { background: linear-gradient(90deg, var(--badbg), transparent); }
.cam { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--card2); font-size: 20px; }
.thumbs { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.thumbs figure { margin: 0; width: 92px; }
.thumbs img { width: 92px; height: 92px; object-fit: cover; border-radius: 10px; background: var(--card2); display: block; }
.thumbs figcaption { display: flex; gap: 2px; margin-top: 3px; }
.thumbs input { width: 64px; background: var(--card2); border: 1px solid var(--line); border-radius: 6px; font-size: 12px; padding: 2px; }
.thumbs button { border: 0; background: none; color: var(--dim); }
.card.loading { opacity: .6; }
/* rituals */
.ritrow { display: grid; grid-template-columns: 28px 1fr auto 14px; gap: 10px; align-items: center; width: 100%; background: none; border: 0; border-top: 1px solid var(--line); padding: 10px 0; text-align: left; }
.ritrow i { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; font-style: normal; font-weight: 800; font-size: 13px; }
.ritrow small { color: var(--dim); font-size: 11px; } .ritrow em { color: var(--dim); font-style: normal; }
.st-row-miss span { color: var(--bad); }
.rit { display: grid; grid-template-columns: 38px 1fr; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.rit p { margin: 2px 0 6px; color: var(--mute); font-size: 12.5px; }
.rit .ck { width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line); background: var(--card2); }
.rit.on .ck { background: var(--good); border-color: var(--good); } .rit.on .ck::after { content: "✓"; color: #10240f; font-weight: 800; }
.jin { display: block; width: 100%; margin-top: 6px; background: var(--card2); border: 1px solid var(--line); border-radius: 10px; padding: 10px; font-size: 16px; color: var(--text); }
/* session overlay */
#sess { position: fixed; inset: 0; z-index: 60; background: radial-gradient(circle at 50% 38%, #1b2a33, var(--bg) 72%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: calc(20px + env(safe-area-inset-top)) 24px calc(30px + env(safe-area-inset-bottom)); text-align: center; }
#sess[hidden] { display: none; }
#sess .x { position: absolute; top: calc(14px + env(safe-area-inset-top)); right: 16px; width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--card2); font-size: 18px; }
.sess-top { color: var(--mute); font-size: 14px; letter-spacing: .04em; }
.orb { width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #d6fff2, #86d5c0 42%, #1f4a41 82%); box-shadow: 0 0 90px rgba(134,213,192,.35); transition: transform .12s linear; transform: scale(.6); }
.orb.squeeze { background: radial-gradient(circle at 50% 45%, #ffffff, #d9c2ff 35%, #6b3fd1 70%, #1c1036 95%); box-shadow: 0 0 110px rgba(190,150,255,.55); }
.sess-steps { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; max-width: 340px; min-height: 0; }
.sess-steps span { font-size: 12px; padding: 4px 9px; border-radius: 999px; background: var(--card2); color: var(--dim); }
.sess-steps span.on { background: var(--acc); color: var(--acc-ink); font-weight: 700; }
.orb.calm { background: radial-gradient(circle at 35% 30%, #a9d4ff, #3d6fb0 50%, #101c30 85%); box-shadow: 0 0 80px rgba(90,169,255,.3); }
.sess-big { font-size: 56px; font-weight: 800; font-variant-numeric: tabular-nums; }
.sess-sub { color: var(--mute); font-size: 16px; max-width: 320px; line-height: 1.5; }
.ring-big { position: relative; width: 240px; height: 240px; } .ring-big b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 48px; font-variant-numeric: tabular-nums; }
/* flashcards */
.flash { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 26px 18px; margin: 12px 0; text-align: center; min-height: 230px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; cursor: pointer; }
.fw { font-size: 32px; font-weight: 800; letter-spacing: -.01em; text-wrap: balance; }
.fa { font-size: 22px; color: var(--acc); font-weight: 700; margin-top: 8px; text-wrap: balance; }
.grade { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.grade .btn { padding: 14px 6px; font-size: 14px; }
.g0 { background: var(--badbg); color: var(--bad); } .g1 { background: #2a2618; color: var(--warn); } .g2 { background: var(--goodbg); color: var(--good); }

/* calm today */
.affirm { color: var(--mute); font-size: 14px; font-style: italic; margin: 2px 0 6px; }
.dayhead { display: flex; gap: 16px; align-items: center; margin: 14px 0 4px; }
.dh-r { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.dh-r b { font-size: 18px; }
.vibe-chip { align-self: flex-start; margin-top: 6px; border: 1px solid rgba(184,168,240,.35); background: rgba(184,168,240,.10); color: var(--text); border-radius: 999px; padding: 6px 12px; font-size: 13px; }
.next { background: linear-gradient(160deg, rgba(134,213,192,.14), rgba(134,213,192,.03) 60%), var(--card); border: 1px solid rgba(134,213,192,.30); border-radius: 22px; padding: 18px; margin: 14px 0; }
.next h2 { margin: 4px 0 2px; font-size: 22px; }
.next.rest { background: linear-gradient(160deg, rgba(230,194,127,.12), transparent 70%), var(--card); border-color: rgba(230,194,127,.3); }
.next.calm { background: linear-gradient(160deg, rgba(184,168,240,.14), transparent 70%), var(--card); border-color: rgba(184,168,240,.3); }
.btn.ghost { background: transparent; color: var(--mute); box-shadow: inset 0 0 0 1px var(--line); }
.card.list { padding: 4px 14px; }
.trow { display: grid; grid-template-columns: 30px 1fr 12px; gap: 12px; align-items: center; width: 100%; background: none; border: 0; border-top: 1px solid var(--line); padding: 12px 0; text-align: left; }
.trow:first-child { border-top: 0; }
.trow i { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; font-style: normal; font-weight: 800; font-size: 13px; }
.trow span { display: flex; flex-direction: column; min-width: 0; }
.trow b { font-weight: 600; font-size: 15px; }
.trow small { color: var(--dim); font-size: 12px; }
.trow em { color: var(--dim); font-style: normal; }
.trow.is-next b { color: var(--acc); }
.trow.soft-miss b { color: var(--mute); }
.trow.soft-miss i { opacity: .8; }
.pastebox { width: 100%; margin-top: 8px; background: var(--card2); border: 1px dashed var(--acc); border-radius: 12px; padding: 12px; font-size: 16px; color: var(--text); }
.segpage { margin: 12px 0 4px; position: sticky; top: env(safe-area-inset-top); z-index: 4; backdrop-filter: blur(10px); background: rgba(27,37,43,.85); }
/* frequency */
.freq-hero { position: relative; overflow: hidden; padding-top: 112px; background: radial-gradient(circle at 50% 0%, rgba(184,168,240,.14), transparent 70%), var(--card); }
.wave { position: absolute; left: 0; top: 6px; width: 100%; height: 110px; }
.fh-row { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; }
.fh-score { font-size: 52px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.fh-score span { font-size: 16px; color: var(--dim); font-weight: 600; }
.fh-tip { color: var(--mute); font-size: 13.5px; }
.fh-scale { display: flex; gap: 4px; margin-top: 14px; }
.fh-scale span { flex: 1; text-align: center; font-size: 10.5px; padding: 5px 2px; border-radius: 8px; color: var(--dim); background: var(--card2); border-bottom: 2px solid var(--c); }
.fh-scale span.on { color: var(--bg); background: var(--c); font-weight: 700; }
.slider { display: grid; grid-template-columns: 110px 1fr 26px; gap: 10px; align-items: center; margin-top: 12px; font-size: 14px; }
.slider input { width: 100%; accent-color: var(--acc); }
.slider b { text-align: right; font-variant-numeric: tabular-nums; }
.tunes { display: grid; gap: 10px; margin-top: 8px; }
.tune { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 12px; border-radius: 12px; background: var(--card2); }
.tune b { font-size: 14px; font-weight: 600; }

/* frequency 2 */
.freq-hero { padding-top: 120px; }
.wave { height: 118px; }
.fh-top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-end; }
.fh-lvl { font-size: 64px; font-weight: 800; line-height: .95; color: var(--c); font-variant-numeric: tabular-nums; letter-spacing: -.03em; }
.fh-name { font-size: 22px; font-weight: 800; color: var(--c); }
.fh-side { text-align: right; display: flex; flex-direction: column; gap: 3px; align-items: flex-end; }
.fh-goal { color: var(--mute); font-size: 14px; margin: 12px 0; }
.ladder { display: flex; flex-direction: column; gap: 3px; margin-top: 10px; }
.rung { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center; padding: 7px 10px; border-radius: 10px; border-left: 3px solid var(--c); background: var(--card2); font-size: 13.5px; }
.rung b { font-variant-numeric: tabular-nums; color: var(--c); }
.rung small { color: var(--dim); font-size: 11.5px; }
.rung.on { background: var(--c); color: var(--bg); transform: scale(1.02); }
.rung.on b, .rung.on small { color: var(--bg); }
.line200 { text-align: center; font-size: 11px; color: var(--acc); padding: 6px 0; letter-spacing: .02em; }
.proto li p { margin: 3px 0; color: var(--mute); font-size: 13px; }
.proto li small { color: var(--dim); font-size: 11px; font-style: italic; }
.ins { display: flex; justify-content: space-between; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
.ins:first-of-type { border-top: 0; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; margin: 12px 0; }
.badge { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 6px; text-align: center; opacity: .35; filter: grayscale(1); }
.badge.on { opacity: 1; filter: none; border-color: rgba(184,168,240,.4); }
.badge i { display: block; font-size: 24px; font-style: normal; }
.badge span { font-size: 11px; color: var(--mute); }
.manifesto .lead { font-size: 16px; font-weight: 600; line-height: 1.55; margin-top: 0; }
.manifesto details { border-top: 1px solid var(--line); padding: 10px 0; }
.manifesto details p { color: var(--mute); font-size: 13.5px; margin: 6px 0 4px; }
.manifesto small { color: var(--dim); font-size: 11px; font-style: italic; }
/* scan & shift overlay */
.scan-bar { position: absolute; top: calc(8px + env(safe-area-inset-top)); left: 20px; right: 70px; height: 4px; border-radius: 4px; background: var(--card2); overflow: hidden; }
.scan-bar i { display: block; height: 100%; background: var(--acc); border-radius: 4px; transition: width .4s ease; }
.scan-body { width: 100%; max-width: 420px; display: flex; flex-direction: column; align-items: center; gap: 14px; overflow-y: auto; max-height: 100%; padding: 30px 2px 10px; }
.scan-q { font-size: 24px; margin: 0; text-align: center; line-height: 1.25; }
.scan-opts { display: grid; gap: 8px; width: 100%; }
.scan-opts button { display: flex; gap: 12px; align-items: center; text-align: left; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); font-size: 15px; }
.scan-opts button b { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; background: var(--card2); font-size: 13px; }
.scan-opts button.on, .scan-opts button:active { border-color: var(--acc); background: rgba(134,213,192,.12); }
.emo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; width: 100%; }
.emo-grid button { padding: 12px 8px; border-radius: 12px; border: 1px solid var(--line); border-left: 4px solid var(--c); background: var(--card); font-size: 14px; }
.emo-grid button.on { background: var(--c); color: var(--bg); font-weight: 700; }
.beh-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; width: 100%; }
.beh-grid button { padding: 12px 8px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); font-size: 13px; text-align: left; }
.beh-grid button.on { border-color: var(--good); background: var(--goodbg); color: var(--good); font-weight: 600; }
.scan-back { background: none; border: 0; color: var(--dim); font-size: 14px; padding: 8px; }
.slider.big { width: 100%; grid-template-columns: 120px 1fr 28px; font-size: 15px; }
.result .res-lvl { font-size: 96px; font-weight: 800; line-height: 1; color: var(--c); letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
.result .res-name { font-size: 30px; font-weight: 800; color: var(--c); margin-top: -6px; }
.result .res-meta { color: var(--mute); font-size: 14px; }
.wave.big { position: static; width: 100%; height: 120px; }
.why-src { width: 100%; font-size: 13px; color: var(--mute); background: var(--card); border-radius: 12px; padding: 10px 12px; text-align: left; }
.why-src summary { color: var(--acc); cursor: pointer; }
.why-src i { color: var(--dim); font-size: 11.5px; }

/* nav */
nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(15,21,25,.88); backdrop-filter: blur(14px); border-top: 1px solid var(--line); display: flex; padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); z-index: 10; }
nav button { flex: 1; border: 0; background: none; color: var(--dim); font-size: 10.5px; padding: 4px 0; display: flex; flex-direction: column; align-items: center; gap: 2px; }
nav button svg { width: 24px; height: 24px; }
nav button.on { color: var(--acc); }
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<main class="wrap" id="app"></main>
<input type="file" id="photoIn" accept="image/*" hidden onchange="onPhoto(this)">
<div class="rest" id="rest">
  <div style="flex:1"><div style="font-size:12px;font-weight:600">Rest</div><b id="restT">0:00</b></div>
  <button id="restMinus">−15</button><button id="restPlus">+15</button><button id="restSkip">✕</button>
</div>
<nav id="nav">
  <button data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>Today</button>
  <button data-tab="train"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Training</button>
  <button data-tab="food"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 3v8a3 3 0 0 0 6 0V3M7 3v18M17 21V3c-2 0-3.5 2.5-3.5 6s1.5 5 3.5 5"/></svg>Food</button>
  <button data-tab="spirit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3c2 3 5 5 5 9a5 5 0 0 1-10 0c0-4 3-6 5-9zM12 21v-4"/></svg>Mind</button>
  <button data-tab="learn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 5h7a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H4zM20 5h-4a2 2 0 0 0-2 2"/></svg>Learn</button>
  <button data-tab="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Progress</button>
</nav>
<script src="data.js"></script>

<script src="ui.js"></script>
